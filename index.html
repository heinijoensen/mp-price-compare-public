<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MP Price Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafbfc;
    --card: #ffffff;
    --accent: #0f766e;
    --accent-light: #14b8a6;
    --accent-hover: #0d5f58;
    --green: #059669;
    --red: #dc2626;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); color: var(--text); min-height: 100vh; }
  #pin-gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  #pin-gate .card { background: var(--card); padding: 56px 48px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; max-width: 420px; width: 100%; }
  #pin-gate h2 { margin: 0 0 8px; font-weight: 700; font-size: 1.75rem; }
  #pin-gate p { color: var(--muted); margin: 0 0 24px; }
  #pin-gate input { font-size: 28px; padding: 14px 18px; width: 220px; text-align: center; letter-spacing: 6px; border: 2px solid var(--border); border-radius: 14px; margin: 0 0 20px; font-family: inherit; transition: border .2s; }
  #pin-gate input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 500; font-family: inherit; transition: all .15s; }
  button:hover { background: var(--accent-hover); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.secondary { background: #64748b; }
  button.secondary:hover { background: #475569; }
  #app { display: none; max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
  header { margin-bottom: 32px; }
  header h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  header .sub { color: var(--muted); font-size: 1rem; margin-top: 6px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; background: #f1f5f9; padding: 6px; border-radius: 14px; width: fit-content; }
  .tabs button { background: transparent; color: var(--muted); border-radius: 10px; padding: 10px 18px; font-weight: 500; }
  .tabs button.active { background: var(--card); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .panel { background: var(--card); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
  .upload-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 24px; }
  .upload-box { border: 2px dashed #cbd5e1; padding: 28px 20px; border-radius: 16px; text-align: center; transition: all .2s; background: #fafbfc; }
  .upload-box:hover { border-color: var(--accent-light); background: #f0fdfa; }
  .upload-box.ready { border-color: var(--green); background: #f0fdf4; border-style: solid; }
  .progress-container { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: white; box-shadow: 0 2px 12px rgba(0,0,0,.12); padding: 14px 24px; display: none; }
  .progress-bar { height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); width: 0%; transition: width .4s ease; border-radius: 6px; }
  .progress-text { margin-top: 8px; font-size: 15px; color: var(--text); font-weight: 600; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 14px; margin: 20px 0; align-items: end; }
  .filters label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 500; }
  .filters input, .filters select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: white; }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #f8fafc; cursor: pointer; user-select: none; position: sticky; top: 0; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  th:hover { background: #f1f5f9; }
  tr:hover { background: #f8fafc; }
  .diff-pos { color: var(--red); font-weight: 600; }
  .diff-neg { color: var(--green); font-weight: 600; }
  .settings-section { margin-bottom: 32px; }
  .settings-section h3 { margin: 0 0 12px; font-size: 1.1rem; font-weight: 600; }
  .store-list { margin: 12px 0; }
  .store-item { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; padding: 12px; background: #f8fafc; border-radius: 12px; }
  .store-item input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }
  #status { margin-top: 16px; font-weight: 500; color: var(--text); }
  .error { color: var(--red); font-weight: 600; }
  @media (max-width: 700px) { .upload-row { grid-template-columns: 1fr; } .tabs { width: 100%; justify-content: center; } }
</style>
</head>
<body>

<div id="pin-gate">
  <div class="card">
    <h2>MP Price Comparison</h2>
    <p>Enter PIN to continue</p>
    <input type="password" id="pin" maxlength="6" placeholder="••••••" autofocus>
    <br>
    <button onclick="checkPin()">Enter</button>
    <p id="pin-error" style="color:var(--red); display:none; margin-top:16px;">Wrong PIN</p>
  </div>
</div>

<div id="app">
  <header>
    <h1>MP Price Comparison</h1>
    <div class="sub">Compare handil.mp.fo against competitors · exact EAN / VVS matching</div>
  </header>

  <div class="tabs">
    <button class="active" onclick="showTab('upload')">Upload & Run</button>
    <button onclick="showTab('results')">Results</button>
    <button onclick="showTab('settings')">Settings</button>
  </div>

  <div id="tab-upload" class="panel">
    <div class="upload-row" id="upload-boxes"></div>
    <button id="run-btn" onclick="runComparison()" disabled>Run comparison</button>
    <div id="status"></div>
  </div>

  <div id="tab-results" class="panel" style="display:none;">
    <div class="filters">
      <div>
        <label>Search</label>
        <input type="text" id="f-search" placeholder="name..." oninput="applyFilters()">
      </div>
      <div>
        <label>Shop</label>
        <select id="f-shop" onchange="applyFilters()">
          <option value="">All</option>
          <option value="__unmatched__">Only unmatched</option>
        </select>
      </div>
      <div>
        <label>Difference</label>
        <select id="f-diff" onchange="applyFilters()">
          <option value="">All</option>
          <option value="cheaper">We are cheaper</option>
          <option value="more">We are more expensive</option>
          <option value="big">|Diff| > 20%</option>
        </select>
      </div>
      <div>
        <label>Price min</label>
        <input type="number" id="f-min" placeholder="0" oninput="applyFilters()" style="width:100px">
      </div>
      <div>
        <label>Price max</label>
        <input type="number" id="f-max" placeholder="any" oninput="applyFilters()" style="width:100px">
      </div>
      <button onclick="downloadResults()">Download Excel</button>
    </div>
    <div id="results-container"></div>
  </div>

  <div id="tab-settings" class="panel" style="display:none;">
    <div class="settings-section">
      <h3>Columns</h3>
      <div id="col-toggles" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>
    <div class="settings-section">
      <h3>Options</h3>
      <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="set-ratio" checked> Reject pairs with price ratio > 2.5×</label>
    </div>
    <div class="settings-section">
      <h3>Competitor stores</h3>
      <p style="color:var(--muted); font-size:14px; margin-top:0;">Add shops to compare against. Freight % is added to their prices.</p>
      <div class="store-list" id="store-list"></div>
      <button onclick="addStore()">+ Add store</button>
    </div>
    <p style="color:var(--muted); font-size:13px;">Settings are saved in this browser.</p>
  </div>
</div>

<div class="progress-container" id="progress-container">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="progress-text" id="progress-text"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PIN = "312000";
let files = { handil: null };
let allResults = [];
let sortCol = "difference_pct";
let sortDir = -1;
let stores = [
  { id: "krosstein", name: "Krosstein", freight: 0 },
  { id: "billig", name: "BilligVVS", freight: 8 }
];

const COLUMNS = [
  { key: "MP_nr", label: "MP nr", show: true },
  { key: "MP_name", label: "MP name", show: true },
  { key: "MP_price", label: "MP price", show: true },
  { key: "shop", label: "Shop", show: true },
  { key: "shop_id", label: "Shop id", show: false },
  { key: "shop_name", label: "Shop name", show: true },
  { key: "shop_price", label: "Shop price", show: true },
  { key: "difference_pct", label: "Diff %", show: true },
  { key: "how_paired", label: "Paired by", show: true },
];

document.getElementById("pin").addEventListener("keydown", (e) => {
  if (e.key === "Enter") checkPin();
});

function checkPin() {
  if (document.getElementById("pin").value === PIN) {
    document.getElementById("pin-gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadSettings();
    buildColToggles();
    renderStores();
    renderUploadBoxes();
  } else {
    document.getElementById("pin-error").style.display = "block";
  }
}

function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  if (event && event.target) event.target.classList.add("active");
  ["upload","results","settings"].forEach(t => {
    document.getElementById("tab-" + t).style.display = t === name ? "block" : "none";
  });
  if (name === "settings") renderStores();
}

function renderUploadBoxes() {
  const container = document.getElementById("upload-boxes");
  let html = `
    <div class="upload-box" id="box-handil">
      <strong>handil.mp.fo</strong><br><small>our shop</small><br><br>
      <input type="file" id="file-handil" accept=".xlsx,.xls,.csv" onchange="fileLoaded('handil')">
    </div>`;
  stores.forEach(s => {
    html += `
    <div class="upload-box" id="box-${s.id}">
      <strong>${s.name}</strong><br><small>${s.freight ? '+' + s.freight + '% freight' : 'no freight'}</small><br><br>
      <input type="file" id="file-${s.id}" accept=".xlsx,.xls,.csv" onchange="fileLoaded('${s.id}')">
    </div>`;
  });
  container.innerHTML = html;
  updateRunButton();
}

function fileLoaded(key) {
  const input = document.getElementById("file-" + key);
  if (input.files.length) {
    files[key] = input.files[0];
    const box = document.getElementById("box-" + key);
    if (box) box.classList.add("ready");
  }
  updateRunButton();
}

function updateRunButton() {
  document.getElementById("run-btn").disabled = !files.handil;
}

function cleanEAN(v) { if (v == null) return null; const s = String(v).replace(/\D/g, ""); return s.length >= 8 ? s : null; }
function cleanVVS(v) { if (v == null) return null; const s = String(v).replace(/\D/g, ""); return (s.length >= 6 && s.length <= 10) ? s : null; }
function num(v) { if (v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; }

function parseFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error("No file")); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
        resolve(json);
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error("Failed to read file"));
    reader.readAsArrayBuffer(file);
  });
}

function setProgress(pct, text) {
  const container = document.getElementById("progress-container");
  const fill = document.getElementById("progress-fill");
  const txt = document.getElementById("progress-text");
  if (container) {
    container.style.display = "block";
    if (fill) fill.style.width = pct + "%";
    if (txt) txt.textContent = text;
  }
}

async function runComparison() {
  const status = document.getElementById("status");
  status.textContent = "";
  status.className = "";
  setProgress(5, "Starting...");
  try {
    if (!files.handil) throw new Error("Please upload the handil file first");
    const handil = await parseFile(files.handil);
    setProgress(15, "Handil loaded");

    const shopData = {};
    let progress = 20;
    const step = 45 / Math.max(1, stores.length);
    for (const s of stores) {
      if (files[s.id]) {
        setProgress(progress, `Reading ${s.name}...`);
        shopData[s.id] = await parseFile(files[s.id]);
        progress += step;
      }
    }

    setProgress(70, "Pairing products...");
    const useRatio = document.getElementById("set-ratio").checked;

    const lookups = {};
    stores.forEach(s => {
      lookups[s.id] = { byEAN: {}, byVVS: {} };
      const data = shopData[s.id] || [];
      data.forEach(r => {
        const ean = cleanEAN(r.ean);
        const vvs = cleanVVS(r.sku || r.vvs_nr);
        let price = num(r.price);
        if (price && s.freight) price = price * (1 + s.freight / 100);
        if (ean && price) lookups[s.id].byEAN[ean] = { ...r, price };
        if (vvs && price) lookups[s.id].byVVS[vvs] = { ...r, price };
      });
    });

    allResults = handil.map(mp => {
      const mpNr = mp.nr || mp.id || "";
      const mpName = mp.name || "";
      const mpPrice = num(mp.price);
      const mpEAN = cleanEAN(mp.ean);
      const mpVVS = cleanVVS(mp.nr) || cleanVVS(mp.vvs);
      let best = null;
      function consider(hit, shopName, method) {
        if (!hit || !hit.price) return;
        if (useRatio && mpPrice && (hit.price / mpPrice > 2.5 || mpPrice / hit.price > 2.5)) return;
        if (!best || hit.price < best.shop_price) {
          best = { shop: shopName, shop_id: hit.sku || hit.id || hit.vvs_nr || "", shop_name: hit.name || "", shop_price: hit.price, method };
        }
      }
      stores.forEach(s => {
        if (mpEAN && lookups[s.id].byEAN[mpEAN]) consider(lookups[s.id].byEAN[mpEAN], s.name, "EAN");
        if (mpVVS && lookups[s.id].byVVS[mpVVS]) consider(lookups[s.id].byVVS[mpVVS], s.name, "VVS");
      });
      const diff = (best && mpPrice) ? ((best.shop_price - mpPrice) / mpPrice * 100) : null;
      return {
        MP_nr: mpNr, MP_name: mpName, MP_price: mpPrice,
        shop: best ? best.shop : "", shop_id: best ? best.shop_id : "", shop_name: best ? best.shop_name : "",
        shop_price: best ? best.shop_price : null,
        difference_pct: diff != null ? Math.round(diff * 10) / 10 : null,
        how_paired: best ? best.method : ""
      };
    });

    setProgress(100, "Complete");
    setTimeout(() => { document.getElementById("progress-container").style.display = "none"; }, 1500);
    status.textContent = `Done. ${allResults.filter(r => r.shop).length} matched out of ${allResults.length}.`;
    updateShopFilter();
    showTab("results");
    document.querySelector(".tabs button:nth-child(2)").classList.add("active");
    document.querySelector(".tabs button:nth-child(1)").classList.remove("active");
    applyFilters();
  } catch (err) {
    console.error(err);
    setProgress(0, "Error");
    status.textContent = "Error: " + (err.message || err);
    status.className = "error";
    setTimeout(() => { document.getElementById("progress-container").style.display = "none"; }, 3000);
  }
}

function updateShopFilter() {
  const sel = document.getElementById("f-shop");
  const current = sel.value;
  sel.innerHTML = '<option value="">All</option><option value="__unmatched__">Only unmatched</option>';
  stores.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.name;
    opt.textContent = s.name;
    sel.appendChild(opt);
  });
  if (current) sel.value = current;
}

function applyFilters() {
  const q = (document.getElementById("f-search").value || "").toLowerCase();
  const shop = document.getElementById("f-shop").value;
  const diff = document.getElementById("f-diff").value;
  const min = num(document.getElementById("f-min").value);
  const max = num(document.getElementById("f-max").value);

  let rows = allResults.filter(r => {
    if (q && !((r.MP_name || "").toLowerCase().includes(q) || (r.shop_name || "").toLowerCase().includes(q))) return false;
    if (shop === "__unmatched__") return !r.shop;
    if (shop && r.shop !== shop) return false;
    if (diff === "cheaper" && !(r.difference_pct > 0)) return false;
    if (diff === "more" && !(r.difference_pct < 0)) return false;
    if (diff === "big" && !(Math.abs(r.difference_pct) > 20)) return false;
    if (min != null && (r.MP_price == null || r.MP_price < min)) return false;
    if (max != null && (r.MP_price == null || r.MP_price > max)) return false;
    return true;
  });

  rows.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va == null) va = sortDir > 0 ? Infinity : -Infinity;
    if (vb == null) vb = sortDir > 0 ? Infinity : -Infinity;
    if (typeof va === "string") return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });

  renderTable(rows);
}

function renderTable(rows) {
  const visible = COLUMNS.filter(c => c.show);
  let html = `<div style="margin-bottom:10px; color:var(--muted); font-size:14px;">Showing ${rows.length} of ${allResults.length}</div>
  <table><thead><tr>`;
  visible.forEach(c => {
    html += `<th onclick="sortBy('${c.key}')">${c.label} ${sortCol===c.key ? (sortDir>0?"↑":"↓") : ""}</th>`;
  });
  html += "</tr></thead><tbody>";
  rows.forEach(r => {
    html += "<tr>";
    visible.forEach(c => {
      let val = r[c.key];
      let cls = "";
      if (c.key === "difference_pct" && val != null) cls = val > 0 ? "diff-pos" : "diff-neg";
      if (typeof val === "number" && c.key.includes("price")) val = val.toFixed(2);
      if (val == null) val = "";
      html += `<td class="${cls}">${String(val).slice(0, 80)}</td>`;
    });
    html += "</tr>";
  });
  html += "</tbody></table>";
  document.getElementById("results-container").innerHTML = html;
}

function sortBy(key) {
  if (sortCol === key) sortDir *= -1;
  else { sortCol = key; sortDir = key === "difference_pct" ? -1 : 1; }
  applyFilters();
}

function downloadResults() {
  if (!allResults.length) return;
  const ws = XLSX.utils.json_to_sheet(allResults);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Comparison");
  XLSX.writeFile(wb, "mp_comparison.xlsx");
}

function buildColToggles() {
  const box = document.getElementById("col-toggles");
  box.innerHTML = COLUMNS.map(c => 
    `<label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" data-key="${c.key}" ${c.show?"checked":""} onchange="toggleCol(this)"> ${c.label}</label>`
  ).join("");
}
function toggleCol(el) {
  const col = COLUMNS.find(c => c.key === el.dataset.key);
  if (col) col.show = el.checked;
  saveSettings();
  if (allResults.length) applyFilters();
}

function renderStores() {
  const list = document.getElementById("store-list");
  list.innerHTML = stores.map((s, i) => `
    <div class="store-item">
      <input type="text" value="${s.name}" onchange="updateStore(${i}, 'name', this.value)" placeholder="Store name">
      <input type="number" value="${s.freight}" onchange="updateStore(${i}, 'freight', this.value)" placeholder="Freight %" style="width:110px">
      <button class="secondary" onclick="removeStore(${i})">Remove</button>
    </div>
  `).join("");
}
function updateStore(i, key, val) {
  if (key === "freight") val = num(val) || 0;
  stores[i][key] = val;
  saveSettings();
  renderUploadBoxes();
}
function addStore() {
  stores.push({ id: "store" + Date.now(), name: "New store", freight: 0 });
  saveSettings();
  renderStores();
  renderUploadBoxes();
}
function removeStore(i) {
  stores.splice(i, 1);
  saveSettings();
  renderStores();
  renderUploadBoxes();
}

function saveSettings() {
  localStorage.setItem("mp-cols", JSON.stringify(COLUMNS.map(c => ({key:c.key, show:c.show}))));
  localStorage.setItem("mp-ratio", document.getElementById("set-ratio").checked);
  localStorage.setItem("mp-stores", JSON.stringify(stores));
}
function loadSettings() {
  try {
    const savedCols = JSON.parse(localStorage.getItem("mp-cols") || "[]");
    savedCols.forEach(s => { const c = COLUMNS.find(x => x.key === s.key); if (c) c.show = s.show; });
    const r = localStorage.getItem("mp-ratio");
    if (r !== null) document.getElementById("set-ratio").checked = r === "true";
    const savedStores = JSON.parse(localStorage.getItem("mp-stores") || "null");
    if (savedStores) stores = savedStores;
  } catch(e) {}
}
document.getElementById("set-ratio").onchange = saveSettings;
</script>
</body>
</html>
